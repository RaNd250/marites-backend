syntax = "proto3";

package telemetry;

option elixir_module_prefix = "Marites.FleetTelemetry";

message Payload {
  string vin    = 1;
  string txid   = 4;
  repeated Datum data = 2;
}

message Datum {
  Field key   = 1;
  Value value = 2;
}

message Value {
  oneof value {
    string string_value   = 1;
    int64  int_value      = 2;
    double double_value   = 3;
    bool   bool_value     = 4;
    Location location_value = 5;
    float  float_value    = 6;
  }
}

message Location {
  double latitude  = 1;
  double longitude = 2;
}

// Field enum — only the fields we subscribe to
enum Field {
  Unknown        = 0;
  Location       = 73;
  Odometer       = 129;
  SentryMode     = 167;
  Soc            = 182;
  VehicleSpeed   = 183;
  ChargeState    = 12;
  ShiftState     = 196;
  GearSelector   = 60;
}
